services:
  qr-scanner:
    build: .
    restart: unless-stopped
    ports:
      - "3001:3000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    # Host ./data must be writable by container user nextjs (uid 100).
    # After first create: chmod 777 data  OR  chown -R 100:101 data
