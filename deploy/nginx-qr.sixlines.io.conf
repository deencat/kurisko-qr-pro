# Nginx vhost for Kurisko QR Pro (use when nginx already owns 80/443 on this VPS).
# Install: sudo bash scripts/setup-nginx-qr.sh

server {
	listen 80;
	listen [::]:80;
	server_name qr.sixlines.io;

	location ^~ /.well-known/acme-challenge/ {
		root /var/www/html;
		allow all;
	}

	location / {
		return 301 https://$host$request_uri;
	}
}

server {
	listen 443 ssl http2;
	listen [::]:443 ssl http2;
	server_name qr.sixlines.io;

	ssl_certificate /etc/letsencrypt/live/sixlines.io/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/sixlines.io/privkey.pem;
	include /etc/letsencrypt/options-ssl-nginx.conf;
	ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

	location / {
		proxy_pass http://127.0.0.1:3001;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_cache_bypass $http_upgrade;
		proxy_read_timeout 60s;
	}
}
